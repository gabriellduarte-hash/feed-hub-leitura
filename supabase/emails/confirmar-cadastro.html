<!--
  Modelo do e-mail "Confirm signup" do Supabase, em português. Só é
  usado se a confirmação de e-mail estiver ligada (Supabase ›
  Authentication › Providers › Email › Confirm email). Hoje está
  desligada: a conta entra direto e o e-mail de boas-vindas sai pelo hub.
  Onde colar: Supabase › Authentication › Emails › Confirm signup
    Subject: Confirme seu e-mail no Feed de Notícias
-->
<div style="background:#f4f3f0;padding:32px 16px;font-family:'JetBrains Mono',Menlo,Consolas,monospace;">
  <div style="max-width:520px;margin:0 auto;">
    <p style="margin:0 0 24px;font-size:11px;font-weight:700;letter-spacing:3px;color:#121212;"><span style="color:#6d3ff5;">●</span>&nbsp;FEED DE NOTÍCIAS</p>
    <h1 style="margin:0 0 12px;font-size:22px;font-weight:800;color:#121212;">Falta só confirmar seu e-mail</h1>
    <p style="margin:0 0 24px;font-size:14px;line-height:1.7;color:#3f3d39;">Toque no botão abaixo para ativar sua conta e começar a seguir suas fontes.</p>
    <p style="margin:0 0 24px;"><a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email&next=/" style="display:inline-block;padding:12px 22px;border-radius:8px;background:#121212;color:#ffffff;font-size:13px;font-weight:700;text-decoration:none;">Confirmar e-mail →</a></p>
    <p style="margin:0;font-size:11px;line-height:1.7;color:#8d8a83;">Se você não criou uma conta, pode ignorar este e-mail.</p>
  </div>
</div>
